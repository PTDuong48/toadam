<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tọa Đàm 20/11 – Ngày Nhà Giáo Việt Nam</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,500;1,400;1,500;1,600&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark-green:#153e26;
  --mid-green:#246a42;
  --accent-gold:#f5c842;
  --scarlet:#e63946;
  --orange-phuong:#ff6b35;
}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:'Be Vietnam Pro',sans-serif;
  background:
    radial-gradient(ellipse 65% 55% at 50% 32%, #ffffff 0%, rgba(255,255,245,0.7) 35%, transparent 75%),
    linear-gradient(175deg, #d8f3e5 0%, #eaf8f0 42%, #d5f0e1 75%, #bfe4cd 100%);
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; position:relative;
}

/* ── SUNBEAMS (LUỒNG NẮNG CHIẾU XIÊN ẤM ÁP) ── */
.sunbeams{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(circle at 65% 18%, rgba(255,255,255,0.85) 0%, rgba(255,250,210,0.4) 30%, transparent 60%),
    linear-gradient(128deg, transparent 18%, rgba(255,255,230,0.22) 28%, transparent 38%, rgba(255,250,205,0.3) 48%, transparent 58%, rgba(255,255,225,0.18) 68%, transparent 80%);
  mix-blend-mode:soft-light;
  animation:sunShift 9s ease-in-out infinite alternate;
}
@keyframes sunShift{
  0%{opacity:0.8;transform:scale(1)}
  100%{opacity:1;transform:scale(1.03)}
}

/* ── CANVASES (HẠT SÁNG & CÁNH HOA PHƯỢNG RƠI) ── */
#particleCanvas,#petalCanvas{position:fixed;inset:0;pointer-events:none}
#particleCanvas{z-index:3} #petalCanvas{z-index:12}

/* ── THẢM CỎ XANH MƯỚT ĐÁY MÀN HÌNH (MEADOW) ── */
.meadow-wrap{
  position:fixed;bottom:0;left:0;width:100%;
  height:clamp(130px, 20vh, 210px);
  z-index:8;pointer-events:none;
}
.meadow-svg{width:100%;height:100%;display:block}

/* ── 2 CÂY PHƯỢNG VĨ CỔ THỤ KHUNG 2 BÊN ─────── */
.fl-tree{
  position:fixed;top:0;bottom:0;
  width:clamp(230px, 26vw, 420px);
  height:100vh;
  z-index:10;pointer-events:none;
}
.tree-left{
  left:0;
  animation:swayTreeL 8s ease-in-out infinite;
  transform-origin:left bottom;
}
.tree-right{
  right:0;
  animation:swayTreeR 8.5s ease-in-out infinite;
  transform-origin:right bottom;
}
@keyframes swayTreeL{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(0.8deg) translateY(-2px)}
}
@keyframes swayTreeR{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(-0.8deg) translateY(-2px)}
}
.tree-svg{width:100%;height:100%;display:block}

/* ── FLYING PAPER PLANES & MUSIC NOTES ──────── */
.fly-item{position:fixed;pointer-events:none;z-index:9}
.plane-l{
  top:clamp(40px, 11vh, 110px);
  left:clamp(170px, 23vw, 360px);
  animation:flightL 9s ease-in-out infinite;
}
.plane-r{
  top:clamp(55px, 14vh, 130px);
  right:clamp(170px, 23vw, 360px);
  animation:flightR 10s 1.5s ease-in-out infinite;
}
@keyframes flightL{
  0%,100%{transform:translate(0, 0) rotate(-6deg)}
  50%{transform:translate(18px, -14px) rotate(-1deg)}
}
@keyframes flightR{
  0%,100%{transform:translate(0, 0) rotate(8deg)}
  50%{transform:translate(-16px, -12px) rotate(3deg)}
}
.note-item{
  font-family:serif;font-size:clamp(1rem, 1.8vw, 1.45rem);
  color:#1b432a;opacity:0.65;
  filter:drop-shadow(0 2px 4px rgba(255,255,255,0.8));
  animation:floatNote 5s ease-in-out infinite;
}

/* ── ĐẠO CỤ GỐC CÂY (SÁCH MỞ & CHỒNG SÁCH) ───── */
.edu-prop{
  position:fixed;bottom:clamp(10px, 2.5vh, 32px);
  z-index:11;pointer-events:none;
  filter:drop-shadow(0 6px 14px rgba(20,50,30,0.25));
}
.edu-art-left{left:clamp(30px, 6.5vw, 120px)}
.edu-art-right{right:clamp(30px, 6.5vw, 120px)}
.edu-prop svg{width:clamp(135px, 13vw, 195px);height:auto;display:block}

/* ── KHÔNG GIAN TRUNG TÂM (CENTER STAGE) ──────── */
.center-stage{
  position:relative;z-index:15;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
  width:100%;max-width:min(900px, 86vw);
  margin-top:clamp(-20px, -2vh, 0);
  animation:fadeIn 1.3s cubic-bezier(.22,1,.36,1) both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ── TYPOGRAPHY TRUNG TÂM ─────────────────────── */
.title-with-swash{
  display:inline-flex;align-items:center;justify-content:center;
  gap:clamp(8px, 1.5vw, 20px);
}
.swash{
  width:clamp(28px, 4.5vw, 55px);
  height:auto;fill:none;stroke:#1c3d2a;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  opacity:0.88;
}
.swash-r{transform:scaleX(-1)}

.t-main{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.8rem, 6.8vw, 5.1rem);
  font-weight:900;letter-spacing:0.06em;line-height:1.0;
  color:var(--dark-green);
  text-shadow:
    0 2px 14px rgba(255,255,255,0.9),
    0 4px 24px rgba(36,106,66,0.22);
  margin:0;
}

.t-sub-event{
  font-family:'Dancing Script',cursive;
  font-size:clamp(1.75rem, 4.2vw, 3.2rem);
  font-weight:700;letter-spacing:0.02em;line-height:1.2;
  color:#1a462b;
  margin-top:clamp(4px, 1vh, 10px);
  text-shadow:0 1px 8px rgba(255,255,255,0.85);
}

.subtitle{
  font-family:'Lora',serif;font-style:italic;
  font-size:clamp(0.85rem, 1.7vw, 1.08rem);
  font-weight:500;line-height:1.6;
  color:#244b34;
  margin-top:clamp(4px, 0.8vh, 8px);
  max-width:480px;
  text-shadow:0 1px 4px rgba(255,255,255,0.9);
}

/* ── HOẠT CẢNH CÔ TRÒ TRI ÂN (SCENE) ────────── */
.scene-storybook{
  margin-top:clamp(4px, 1.2vh, 16px);
  width:clamp(290px, 46vw, 580px);
  height:auto;display:block;
  filter:drop-shadow(0 6px 16px rgba(25,60,35,0.18));
  animation:gentleBreath 6s ease-in-out infinite;
}
@keyframes gentleBreath{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3.5px)}
}

/* ── CỤM NÚT ĐIỀU KHIỂN (GÓC DƯỚI TAY PHẢI) ─── */
.bottom-actions{
  position:fixed;bottom:18px;right:22px;z-index:300;
  display:flex;align-items:center;gap:10px;
}
.vol-group{
  display:flex;align-items:center;
  height:42px;border-radius:100px;
  background:rgba(255,255,255,0.78);
  backdrop-filter:blur(14px);
  border:1.5px solid rgba(45,154,98,0.5);
  box-shadow:0 4px 16px rgba(24,78,52,0.18);
  padding:0 4px 0 5px;
  transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);
}
.vol-group:hover, .vol-group:focus-within{
  background:rgba(255,255,255,0.95);
  border-color:#246a42;
  box-shadow:0 4px 20px rgba(24,78,52,0.25);
}
.vol-btn{
  width:32px;height:32px;border-radius:50%;
  background:transparent;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--dark-green);flex-shrink:0;padding:0;
  transition:transform .2s ease;
}
.vol-btn:hover{transform:scale(1.12)}
.vol-btn svg{width:18px;height:18px;display:block}
.vol-expand{
  display:flex;align-items:center;gap:6px;
  max-width:0;opacity:0;
  overflow:hidden;pointer-events:none;
  transition:max-width .35s ease, opacity .25s ease, margin .35s ease;
  margin-left:0;white-space:nowrap;
}
.vol-group:hover .vol-expand,
.vol-group:focus-within .vol-expand{
  max-width:140px;opacity:1;pointer-events:auto;
  margin-left:6px;padding-right:6px;
}
.vol-slider{
  -webkit-appearance:none;appearance:none;
  width:75px;height:4px;border-radius:2px;
  background:rgba(45,154,98,0.35);
  outline:none;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:13px;height:13px;border-radius:50%;
  background:#246a42;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,0.25);
  transition:transform .15s ease;
}
.vol-slider::-webkit-slider-thumb:hover{transform:scale(1.25)}
.vol-slider::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;
  background:#246a42;cursor:pointer;border:none;
}
.vol-text{font-size:0.68rem;font-weight:600;color:var(--dark-green);min-width:28px;text-align:right}

.ctrl-btn{
  width:42px;height:42px;border-radius:50%;
  border:1.5px solid rgba(45,154,98,0.5);
  background:rgba(255,255,255,0.78);backdrop-filter:blur(14px);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .25s ease;
  box-shadow:0 4px 16px rgba(24,78,52,0.18);
  color:var(--dark-green);
}
.ctrl-btn:hover{background:rgba(255,255,255,0.95);transform:scale(1.08);border-color:#246a42}
.ctrl-btn svg{width:18px;height:18px;display:block}

.music-wave{display:none;align-items:flex-end;gap:2.5px;height:15px}
.music-wave span{
  width:2.5px;background:#246a42;border-radius:2px;
  animation:wave 1.2s ease-in-out infinite;
}
.music-wave span:nth-child(1){height:8px;animation-delay:0s}
.music-wave span:nth-child(2){height:15px;animation-delay:.2s}
.music-wave span:nth-child(3){height:10px;animation-delay:.4s}
.ctrl-btn.playing .music-icon{display:none}
.ctrl-btn.playing .music-wave{display:flex}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.2)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@media(max-width:768px){
  .fl-tree{width:180px}
  .bottom-actions{bottom:12px;right:14px;gap:6px}
  .edu-prop{display:none}
  .plane-l,.plane-r{display:none}
}
</style>
</head>

═══════════════════════════════════════════ -->
<div class="fl-tree tree-right fl-side-r">
<svg viewBox="0 0 460 880" fill="none" class="tree-svg" xmlns="http://www.w3.org/2000/svg" style="transform:scaleX(-1)">
  <!-- GỐC & THÂN CÂY PHẢI ĐỐI XỨNG HÀI HÒA -->
  <path d="M-40 890 C20 860 70 820 85 730 C95 670 70 590 60 520 C50 440 85 360 110 300 C130 250 145 180 120 100 C110 65 90 20 60 -30 L-60 -30 Z" fill="#442614"/>
  <path d="M-20 890 C40 870 95 830 115 760 C130 700 115 620 95 540 C80 470 105 380 135 320 C160 270 175 190 145 100 C130 50 95 -10 70 -30" stroke="#2b160b" stroke-width="8" stroke-linecap="round"/>

<script>
/* ── PARTICLES (ĐỐM NẮNG VÀNG LUNG LINH) ──── */
(function(){
  const cv=document.getElementById('particleCanvas'),cx=cv.getContext('2d');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let W,H,pts=[];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  rs();window.addEventListener('resize',rs);
  const C=[[255,235,120],[255,200,80],[255,255,255],[130,220,160],[255,160,80]];
  function mk(){return{x:Math.random()*W,y:Math.random()*H,r:.8+Math.random()*2.4,a:.15+Math.random()*.65,da:(.004+Math.random()*.01)*(Math.random()<.5?1:-1),dx:(-.1+Math.random()*.2),dy:(-.06+Math.random()*.12),c:C[Math.floor(Math.random()*C.length)],ph:Math.random()*Math.PI*2}}
  pts=Array.from({length:Math.min(Math.floor(W*H/12000),85)},mk);
  function draw(ts){cx.clearRect(0,0,W,H);const t=ts*.001;pts.forEach(p=>{p.a+=p.da;if(p.a>=.75||p.a<=.05)p.da*=-1;p.x+=p.dx+Math.sin(t+p.ph)*.12;p.y+=p.dy+Math.cos(t*.7+p.ph)*.09;if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;if(p.y<-5)p.y=H+5;if(p.y>H+5)p.y=-5;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle=`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.a.toFixed(3)})`;cx.fill();if(p.r>1.8){const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);g.addColorStop(0,`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${(p.a*.32).toFixed(3)})`);g.addColorStop(1,'rgba(0,0,0,0)');cx.beginPath();cx.arc(p.x,p.y,p.r*5,0,Math.PI*2);cx.fillStyle=g;cx.fill()}});requestAnimationFrame(draw)}
  requestAnimationFrame(draw);
})();

/* ── FALLING PETALS (CÁNH HOA PHƯỢNG ĐỎ CAM & LÁ XANH RƠI) ── */
(function(){
  const cv=document.getElementById('petalCanvas'),cx=cv.getContext('2d');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let W,H,pts=[];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  rs();window.addEventListener('resize',rs);
  // Sắc đỏ cam rực rỡ của hoa phượng, vàng nhạt của nhụy nắng và xanh mát của lá
  const C=['#e63946','#d90429','#f94144','#ff5400','#ff7b00','#f48c06','#ffea79','#ffd166','#52b788','#74c69d','#95d5b2'];
  function mk(){return{x:-60+Math.random()*(W+120),y:-200+Math.random()*-100,vx:-.5+Math.random(),vy:.7+Math.random()*1.6,rot:Math.random()*Math.PI*2,vrot:-.014+Math.random()*.028,rx:4+Math.random()*9,ry:3+Math.random()*6,c:C[Math.floor(Math.random()*C.length)],a:.45+Math.random()*.5,sw:.004+Math.random()*.011,swO:Math.random()*Math.PI*2}}
  const n=Math.min(Math.floor(W/11),70);
  pts=Array.from({length:n},()=>{const p=mk();p.y=Math.random()*H;return p});
  function draw(ts){cx.clearRect(0,0,W,H);const t=ts*.001;pts.forEach(p=>{p.x+=p.vx+Math.sin(t*p.sw+p.swO)*.5;p.y+=p.vy;p.rot+=p.vrot;if(p.y>H+30||p.x<-90||p.x>W+90)Object.assign(p,mk());cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=p.a;cx.beginPath();cx.ellipse(0,0,p.rx,p.ry,0,0,Math.PI*2);cx.fillStyle=p.c;cx.fill();cx.beginPath();cx.ellipse(-p.rx*.2,-p.ry*.2,p.rx*.38,p.ry*.32,-.5,0,Math.PI*2);cx.fillStyle='rgba(255,255,255,.3)';cx.fill();cx.restore()});requestAnimationFrame(draw)}
  requestAnimationFrame(draw);
})();

/* ── MUSIC PLAYLIST & VOLUME CONTROLLER ──────── */
(function(){
  const bgAudio   = document.getElementById('bgAudio');
  const musicBtn  = document.getElementById('musicBtn');
  const volBtn    = document.getElementById('volBtn');
  const volIcon   = document.getElementById('volIcon');
  const volSlider = document.getElementById('volSlider');
  const volText   = document.getElementById('volText');

  // Danh sách 2 bài hát theo thứ tự yêu cầu:
  const playlist = [
    {
      title: "Ngày Đầu Tiên Đi Học",
      src: "ngay-dau-tien-di-hoc.mp3"
    },
    {
      title: "Người Gieo Mầm Xanh",
      src: "nguoi-gieo-mam-xanh.mp3"
    }
  ];

  let currentIdx = 0;
  let isPlaying = false;
  let prevVolume = 0.8;

  // Khởi tạo âm lượng mặc định 80%
  bgAudio.volume = 0.8;

  function loadTrack(idx) {
    currentIdx = idx;
    const track = playlist[idx];
    bgAudio.src = encodeURI(track.src);
  }

  // Load bài đầu tiên: "Ngày đầu tiên đi học"
  loadTrack(0);

  // Khi bài "Ngày đầu tiên đi học" đạt đúng 4:04 (244 giây), chuyển ngay sang bài 2
  bgAudio.addEventListener('timeupdate', () => {
    if (currentIdx === 0 && bgAudio.currentTime >= 244) {
      loadTrack(1); // Chuyển sang "Người gieo mầm xanh"
      bgAudio.play().catch(()=>{});
    }
  });

  // Xử lý khi kết thúc bài (backup hoặc khi kết thúc bài 2):
  // Bài 1 -> chuyển sang bài 2
  // Bài 2 -> tiếp tục lặp lại bài 2 mãi mãi
  bgAudio.addEventListener('ended', () => {
    if (currentIdx === 0) {
      loadTrack(1);
      bgAudio.play().catch(()=>{});
    } else {
      bgAudio.currentTime = 0;
      bgAudio.play().catch(()=>{});
    }
  });

  // Nút Play / Pause
  musicBtn.addEventListener('click', () => {
    if (bgAudio.paused) {
      bgAudio.play().then(() => {
        isPlaying = true;
        musicBtn.classList.add('playing');
      }).catch(err => {
        console.warn("Lỗi phát audio:", err);
      });
    } else {
      bgAudio.pause();
      isPlaying = false;
      musicBtn.classList.remove('playing');
    }
  });

  // Tăng giảm âm lượng qua thanh trượt Slider
  volSlider.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    bgAudio.volume = val;
    bgAudio.muted = false;
    updateVolUI(val);
  });

  // Nút Mute / Unmute
  volBtn.addEventListener('click', () => {
    if (bgAudio.muted || bgAudio.volume === 0) {
      const restore = prevVolume > 0 ? prevVolume : 0.8;
      bgAudio.muted = false;
      bgAudio.volume = restore;
      volSlider.value = restore;
      updateVolUI(restore);
    } else {
      prevVolume = bgAudio.volume;
      bgAudio.muted = true;
      bgAudio.volume = 0;
      volSlider.value = 0;
      updateVolUI(0);
    }
  });

  function updateVolUI(vol) {
    volText.textContent = Math.round(vol * 100) + '%';
    if (vol === 0) {
      volIcon.innerHTML = `
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      `;
    } else if (vol < 0.5) {
      volIcon.innerHTML = `
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      `;
    } else {
      volIcon.innerHTML = `
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      `;
    }
  }
})();

/* ── PARALLAX THEO CHUỘT ─────────────── */
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let tx=0,ty=0,cx2=0,cy2=0;
  const tL=document.querySelector('.tree-left'), tR=document.querySelector('.tree-right');
  const stage=document.querySelector('.center-stage');
  document.addEventListener('mousemove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2});
  function tick(){
    cx2+=(tx-cx2)*.05;cy2+=(ty-cy2)*.05;const s=7;
    if(tL){tL.style.transform=`translateX(${cx2*s*.4}px)`}
    if(tR){tR.style.transform=`translateX(${-cx2*s*.4}px)`}
    if(stage){stage.style.transform=`translate(${cx2*s*.3}px, ${cy2*s*.2}px)`}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
